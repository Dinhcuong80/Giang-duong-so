<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giảng đường số — Bộ môn Lý luận TDTT</title>
<meta name="description" content="Nền tảng học trực tuyến của Bộ môn Lý luận TDTT, Trường Đại học TDTT Bắc Ninh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Giảng đường số — Bộ môn Lý luận TDTT, Trường Đại học TDTT Bắc Ninh
   Ngôn ngữ thị giác: sổ tay huấn luyện + biểu đồ chu kỳ lượng vận động
   ========================================================================== */

:root {
  --ink:        #12233a;
  --ink-soft:   #2d4259;
  --ink-mute:   #6a7f94;
  --paper:      #eef2f5;
  --card:       #ffffff;
  --line:       #c7d6e0;
  --line-soft:  #e1e9ee;
  --accent:     #e0a516;
  --accent-dk:  #b7830a;
  --go:         #1c7a60;
  --go-soft:    #e4f1ed;
  --stop:       #b03a2e;
  --stop-soft:  #f8e8e5;

  --r: 3px;
  --sidebar: 252px;
  --ff-body: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  --ff-head: "Lora", Georgia, serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  font-family: var(--ff-body);
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--paper);
  background-image:
    linear-gradient(to right, rgba(18,35,58,.035) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(18,35,58,.035) 1px, transparent 1px);
  background-size: 28px 28px;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--ff-head);
  font-weight: 600;
  line-height: 1.22;
  margin: 0;
  letter-spacing: -.01em;
}

h1 { font-size: 30px; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }

p { margin: 0 0 .85em; }
a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 3px; }

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 2px;
}

.sr {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

/* ---------- Thành phần dùng chung ------------------------------------- */

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 17px;
  border: 1.5px solid var(--ink);
  border-radius: var(--r);
  background: var(--ink);
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: background .14s, color .14s, border-color .14s;
}
.btn:hover { background: var(--ink-soft); border-color: var(--ink-soft); }
.btn svg {
  width: 15px; height: 15px; flex: 0 0 15px;
  stroke: currentColor; fill: none; stroke-width: 1.9;
  stroke-linecap: round; stroke-linejoin: round;
}

.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: rgba(18,35,58,.06); color: var(--ink); border-color: var(--ink); }

.btn-accent { background: var(--accent); border-color: var(--accent-dk); color: #231a02; }
.btn-accent:hover { background: var(--accent-dk); border-color: var(--accent-dk); color: #fff; }

.btn-sm { padding: 5px 11px; font-size: 13px; border-width: 1.25px; }

.panel {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--r);
}

.panel-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  padding: 15px 20px;
  border-bottom: 1.5px solid var(--line);
}
.panel-head h2, .panel-head h3 { margin: 0; }
.panel-body { padding: 20px; }

.meta { color: var(--ink-mute); font-size: 13.5px; }

.tag {
  display: inline-block;
  padding: 2px 9px;
  border: 1px solid var(--line);
  border-radius: 100px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-soft);
  background: var(--paper);
}
.tag-go   { background: var(--go-soft);   border-color: #b9ddd3; color: #14604a; }
.tag-stop { background: var(--stop-soft); border-color: #eccac4; color: #8e2d23; }
.tag-wait { background: #fdf4e0; border-color: #ecd79e; color: #7a5805; }

/* Thanh tiến độ kiểu biểu đồ chu kỳ huấn luyện */
.load-bar {
  display: block;
  position: relative;
  width: 100%;
  height: 9px;
  background: var(--line-soft);
  border: 1px solid var(--line);
  border-radius: 100px;
  overflow: hidden;
}
.load-bar > i {
  display: block; height: 100%;
  background: var(--ink);
  border-radius: 100px;
}
.load-bar.go > i { background: var(--go); }
.load-bar.accent > i { background: var(--accent); }

/* ---------- Đăng nhập -------------------------------------------------- */

.auth {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.08fr .92fr;
}

.auth-brand {
  position: relative;
  background: var(--ink);
  color: #fff;
  padding: 52px 56px;
  display: flex; flex-direction: column; justify-content: space-between;
  overflow: hidden;
}
.auth-brand::after {
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.055) 1px, transparent 1px);
  background-size: 34px 34px;
  pointer-events: none;
}
.auth-brand > * { position: relative; z-index: 1; }

.mark { display: flex; align-items: center; gap: 12px; }
.mark-glyph {
  width: 36px; height: 36px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--ff-head);
  font-size: 17px;
  color: var(--accent);
}
.mark-text { font-size: 13.5px; line-height: 1.35; }
.mark-text b { display: block; font-weight: 600; font-size: 15px; }
.mark-text span { color: rgba(255,255,255,.62); }

.auth-brand h1 {
  font-size: clamp(32px, 3.6vw, 46px);
  color: #fff;
  max-width: 15ch;
  margin-bottom: 18px;
}
.auth-brand p { color: rgba(255,255,255,.72); max-width: 42ch; font-size: 15.5px; }

/* Biểu đồ chu kỳ — phần tử thị giác chủ đạo của trang đăng nhập */
.cycle { margin-top: 34px; }
.cycle svg { width: 100%; height: 108px; display: block; }
.cycle-key {
  display: flex; gap: 22px; margin-top: 10px;
  font-size: 12.5px; color: rgba(255,255,255,.6);
}
.cycle-key i {
  display: inline-block; width: 16px; height: 2.5px;
  margin-right: 7px; vertical-align: 3px;
}

.auth-form {
  display: flex; align-items: center; justify-content: center;
  padding: 40px 44px;
}
.auth-box { width: 100%; max-width: 372px; }
.auth-box h2 { font-size: 25px; margin-bottom: 6px; }
.auth-box > .meta { margin-bottom: 26px; }

.field { margin-bottom: 15px; }
.field label { display: block; font-size: 13.5px; font-weight: 500; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%;
  padding: 10px 13px;
  border: 1.5px solid var(--line);
  border-radius: var(--r);
  background: #fff;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--ink); outline: none;
}
.field textarea { min-height: 92px; resize: vertical; }

.auth-err {
  padding: 10px 13px; margin-bottom: 15px;
  background: var(--stop-soft);
  border: 1.5px solid #eccac4;
  border-radius: var(--r);
  font-size: 13.5px; color: #8e2d23;
}

.demo-keys {
  margin-top: 26px; padding-top: 20px;
  border-top: 1.5px solid var(--line);
}
.demo-keys > .meta { margin-bottom: 11px; }
.key-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 9px 12px;
  border: 1.5px solid var(--line);
  border-radius: var(--r);
  margin-bottom: 8px;
  background: #fff;
  cursor: pointer;
  text-align: left;
  width: 100%;
  transition: border-color .14s, background .14s;
}
.key-row:hover { border-color: var(--ink); background: var(--paper); }
.key-row b { font-weight: 600; font-size: 13.5px; }
.key-row span { font-size: 12.5px; color: var(--ink-mute); }

/* ---------- Bố cục ứng dụng ------------------------------------------- */

.shell { display: flex; min-height: 100vh; }

.side {
  width: var(--sidebar);
  flex: 0 0 var(--sidebar);
  background: var(--ink);
  color: rgba(255,255,255,.8);
  padding: 22px 0;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.side .mark { padding: 0 22px 22px; }
.side .mark-text b { color: #fff; }

.nav { flex: 1; overflow-y: auto; }
.nav-group { padding: 14px 22px 7px; font-size: 12px; color: rgba(255,255,255,.4); font-weight: 500; }
.nav a {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 22px;
  color: rgba(255,255,255,.76);
  text-decoration: none;
  font-size: 14.5px;
  border-left: 3px solid transparent;
  cursor: pointer;
}
.nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav a.on {
  background: rgba(255,255,255,.1);
  border-left-color: var(--accent);
  color: #fff; font-weight: 500;
}
.nav svg { width: 17px; height: 17px; flex: 0 0 17px; stroke: currentColor; fill: none; stroke-width: 1.7; }

.side-foot {
  padding: 16px 22px 0;
  border-top: 1px solid rgba(255,255,255,.12);
  font-size: 13.5px;
}
.side-foot b { display: block; color: #fff; font-weight: 500; }
.side-foot span { color: rgba(255,255,255,.52); font-size: 12.5px; }
.side-foot button {
  margin-top: 11px; padding: 0; border: 0; background: none;
  color: rgba(255,255,255,.6); font-size: 13px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}
.side-foot button:hover { color: #fff; }

.main { flex: 1; min-width: 0; }

.topbar {
  display: flex; align-items: center; gap: 18px;
  padding: 15px 34px;
  background: rgba(255,255,255,.86);
  backdrop-filter: blur(6px);
  border-bottom: 1.5px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}
.burger { display: none; }

.search { position: relative; flex: 1; max-width: 400px; }
.search input {
  width: 100%; padding: 8px 13px 8px 36px;
  border: 1.5px solid var(--line); border-radius: var(--r); background: #fff;
}
.search input:focus { border-color: var(--ink); outline: none; }
.search svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; stroke: var(--ink-mute); fill: none; stroke-width: 1.8;
}
.search-out {
  position: absolute; top: calc(100% + 7px); left: 0; right: 0;
  background: #fff; border: 1.5px solid var(--line); border-radius: var(--r);
  box-shadow: 0 10px 28px rgba(18,35,58,.13);
  max-height: 330px; overflow-y: auto; z-index: 30;
}
.search-out button {
  display: block; width: 100%; text-align: left;
  padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line-soft);
  background: none; cursor: pointer;
}
.search-out button:last-child { border-bottom: 0; }
.search-out button:hover { background: var(--paper); }
.search-out b { display: block; font-size: 14px; font-weight: 500; }
.search-out span { font-size: 12.5px; color: var(--ink-mute); }

.bell { position: relative; }
.bell > button {
  display: grid; place-items: center;
  width: 36px; height: 36px; padding: 0;
  border: 1.5px solid var(--line); border-radius: var(--r);
  background: #fff; cursor: pointer;
}
.bell > button:hover { border-color: var(--ink); }
.bell svg { width: 17px; height: 17px; stroke: var(--ink); fill: none; stroke-width: 1.7; }
.bell-dot {
  position: absolute; top: -5px; right: -5px;
  min-width: 18px; height: 18px; padding: 0 4px;
  background: var(--stop); color: #fff;
  border-radius: 100px; font-size: 11px; font-weight: 600;
  display: grid; place-items: center;
}
.bell-list {
  position: absolute; top: calc(100% + 9px); right: 0; width: 330px;
  background: #fff; border: 1.5px solid var(--line); border-radius: var(--r);
  box-shadow: 0 12px 30px rgba(18,35,58,.15);
  max-height: 390px; overflow-y: auto; z-index: 40;
}
.bell-list header { padding: 12px 15px; border-bottom: 1.5px solid var(--line); font-weight: 600; font-size: 14px; }
.bell-item { padding: 12px 15px; border-bottom: 1px solid var(--line-soft); }
.bell-item:last-child { border-bottom: 0; }
.bell-item.new { background: #fdfaf0; border-left: 3px solid var(--accent); }
.bell-item b { display: block; font-size: 13.8px; font-weight: 600; margin-bottom: 2px; }
.bell-item p { font-size: 13px; margin: 0 0 3px; color: var(--ink-soft); }

.view { padding: 30px 34px 56px; max-width: 1180px; }

.page-head { margin-bottom: 26px; }
.page-head h1 { margin-bottom: 7px; }
.page-head .meta { max-width: 68ch; }

.grid { display: grid; gap: 18px; }
.g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-side { grid-template-columns: minmax(0,1.68fr) minmax(0,1fr); align-items: start; }

/* Dải chỉ số: phân cách bằng vạch kẻ, không phải thẻ bóng mờ */
.stats {
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
  background: var(--card);
  border: 1.5px solid var(--line); border-radius: var(--r);
  overflow: hidden;
}
.stat { padding: 17px 20px; border-left: 1.5px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat b {
  display: block; font-family: var(--ff-head);
  font-size: 29px; font-weight: 600; line-height: 1.1;
}
.stat span { font-size: 13px; color: var(--ink-mute); }
.stat i { display: block; font-style: normal; font-size: 12.5px; color: var(--go); font-weight: 500; }

/* Hàng dữ liệu kiểu sổ ghi — thay cho lưới thẻ đồng dạng */
.rows { border-top: 1.5px solid var(--line); }
.row {
  display: grid; align-items: center; gap: 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--card);
  text-align: left; width: 100%;
  border-left: 0; border-right: 0; border-top: 0;
  font: inherit; color: inherit;
}
button.row { cursor: pointer; }
button.row:hover { background: #f7fafb; }
.row:last-child { border-bottom: 0; }
.row-subject { grid-template-columns: 34px minmax(0,1fr) 150px 92px 108px; }
.row-lesson  { grid-template-columns: 30px minmax(0,1fr) 108px 112px; }
.row-grade   { grid-template-columns: minmax(0,1fr) 112px 92px 92px; }
.row-student { grid-template-columns: 30px minmax(0,1fr) 112px 118px 96px; }
.row b { display: block; font-size: 14.6px; font-weight: 600; }
.row .meta { font-size: 13px; }
.row-num {
  font-family: var(--ff-head); font-size: 16px;
  color: var(--ink-mute); text-align: right;
}

.empty { padding: 42px 20px; text-align: center; color: var(--ink-mute); }
.empty b { display: block; font-family: var(--ff-head); font-size: 17px; color: var(--ink); margin-bottom: 6px; }

/* ---------- Dashboard: dải chu kỳ học kỳ ------------------------------ */

.term {
  background: var(--ink); color: #fff;
  border-radius: var(--r); padding: 24px 26px 20px;
  position: relative; overflow: hidden;
}
.term::after {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 30px 100%;
  pointer-events: none;
}
.term > * { position: relative; z-index: 1; }
.term h2 { color: #fff; font-size: 20px; margin-bottom: 4px; }
.term .meta { color: rgba(255,255,255,.66); }
.term-weeks { display: flex; gap: 3px; margin-top: 20px; }
.term-weeks div {
  flex: 1; height: 38px;
  background: rgba(255,255,255,.1);
  border-radius: 2px;
  position: relative;
}
.term-weeks div.done { background: var(--accent); }
.term-weeks div.now  { background: #fff; }
.term-weeks div.now::after {
  content: ""; position: absolute; left: 50%; bottom: -9px;
  width: 1.5px; height: 9px; background: #fff;
}
.term-scale {
  display: flex; justify-content: space-between;
  margin-top: 13px; font-size: 12px; color: rgba(255,255,255,.52);
}

/* ---------- Bài học --------------------------------------------------- */

.crumb {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  margin-bottom: 18px; font-size: 13.5px; color: var(--ink-mute);
}
.crumb button {
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px;
}
.crumb button:hover { color: var(--ink); }

.lesson-wrap { display: grid; grid-template-columns: minmax(0,1fr) 292px; gap: 24px; align-items: start; }

.lesson-body { max-width: 72ch; }
.lesson-body h2 { margin: 30px 0 11px; }
.lesson-body h3 { margin: 24px 0 9px; }
.lesson-body p { font-size: 15.5px; }
.lesson-body ul, .lesson-body ol { margin: 0 0 1em; padding-left: 22px; }
.lesson-body li { margin-bottom: 7px; }
.lesson-body blockquote {
  margin: 20px 0; padding: 4px 0 4px 20px;
  border-left: 3px solid var(--accent);
  font-family: var(--ff-head); font-size: 16.5px; color: var(--ink-soft);
}

.slot {
  border: 1.5px dashed var(--line);
  border-radius: var(--r);
  padding: 30px 24px;
  text-align: center;
  background: #fff;
  margin-bottom: 22px;
}
.slot svg { width: 34px; height: 34px; stroke: var(--ink-mute); fill: none; stroke-width: 1.4; margin-bottom: 11px; }
.slot b { display: block; font-family: var(--ff-head); font-size: 16px; margin-bottom: 5px; }
.slot .meta { font-size: 13px; max-width: 46ch; margin: 0 auto; }

.aside-card { margin-bottom: 18px; }
.outline { list-style: none; margin: 0; padding: 0; }
.outline li { border-bottom: 1px solid var(--line-soft); }
.outline li:last-child { border-bottom: 0; }
.outline button {
  display: flex; gap: 11px; width: 100%; text-align: left;
  padding: 11px 20px; border: 0; background: none; cursor: pointer;
  font: inherit; color: inherit; align-items: flex-start;
}
.outline button:hover { background: var(--paper); }
.outline button.on { background: #fdfaf0; box-shadow: inset 3px 0 0 var(--accent); }
.outline .dot {
  flex: 0 0 16px; width: 16px; height: 16px; margin-top: 3px;
  border: 1.5px solid var(--line); border-radius: 50%;
  display: grid; place-items: center;
}
.outline .dot.done { background: var(--go); border-color: var(--go); }
.outline .dot.done::after { content: ""; width: 5px; height: 8px; border: 2px solid #fff; border-top: 0; border-left: 0; transform: rotate(42deg) translateY(-1px); }
.outline b { font-size: 13.8px; font-weight: 500; display: block; }
.outline span { font-size: 12.5px; color: var(--ink-mute); }

/* ---------- Quiz ------------------------------------------------------ */

.quiz { max-width: 760px; }
.quiz-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; border-bottom: 1.5px solid var(--line);
}
.q-block { padding: 24px 26px; border-bottom: 1px solid var(--line-soft); }
.q-block:last-of-type { border-bottom: 0; }
.q-head { display: flex; gap: 13px; margin-bottom: 15px; }
.q-no {
  flex: 0 0 27px; width: 27px; height: 27px;
  border: 1.5px solid var(--ink); border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--ff-head); font-size: 14px; font-weight: 600;
}
.q-head p { margin: 0; font-size: 15.5px; font-weight: 500; padding-top: 2px; }

.opt {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 11px 14px; margin-bottom: 8px;
  border: 1.5px solid var(--line); border-radius: var(--r);
  cursor: pointer; background: #fff;
  transition: border-color .12s, background .12s;
}
.opt:hover { border-color: var(--ink-mute); }
.opt input { margin: 3px 0 0; accent-color: var(--ink); flex: 0 0 auto; }
.opt.pick { border-color: var(--ink); background: var(--paper); }
.opt.right { border-color: var(--go); background: var(--go-soft); }
.opt.wrong { border-color: var(--stop); background: var(--stop-soft); }
.opt-note { margin-left: auto; font-size: 12.5px; font-weight: 600; }
.opt.right .opt-note { color: #14604a; }
.opt.wrong .opt-note { color: #8e2d23; }

.explain {
  margin-top: 11px; padding: 11px 14px;
  background: var(--paper); border-left: 3px solid var(--ink-mute);

const tatCaBai = () => BAI.concat(D.baiThem);
const baiCuaMon = id => tatCaBai().filter(b => b.mon === id).sort((a, b) => a.so - b.so);
const timMon = id => MON.find(m => m.id === id);
const timBai = id => tatCaBai().find(b => b.id === id);

function monCuaToi() {
  if (!S.user || S.user.vai !== 'sv') return MON;
  return MON.filter(m => m.khoa.includes(S.user.khoa));
}

function tienDo(monId) {
  const bs = baiCuaMon(monId);
  if (!bs.length) return 0;
  return Math.round(bs.filter(b => D.xong[b.id]).length / bs.length * 100);
}

function tongTienDo() {
  const ms = monCuaToi();
  const bs = ms.flatMap(m => baiCuaMon(m.id));
  if (!bs.length) return 0;
  return Math.round(bs.filter(b => D.xong[b.id]).length / bs.length * 100);
}

function tatCaTB() {
  return D.tbThem.concat(THONGBAO);

  </header>`;

function ketQuaTim(q) {
  const k = q.trim().toLowerCase();
  const r = [];
  monCuaToi().forEach(m => {
    if ((m.ten + ' ' + m.ma).toLowerCase().includes(k))
      r.push({ loai: 'mon', id: m.id, ten: m.ten, phu: `${m.ma} · ${m.tc} tín chỉ` });
  });
  const bo = h => h.replace(/<[^>]*>/g, ' ');
  tatCaBai().forEach(b => {
    const trongTen = b.ten.toLowerCase().includes(k);
    const trongChuong = b.chuong.toLowerCase().includes(k);
    const trongNoi = bo(b.noidung).toLowerCase().includes(k);
    if (trongTen || trongChuong || trongNoi) {
      const m = timMon(b.mon);
      r.push({
        loai: 'bai', id: b.id, ten: b.ten,
        phu: (m ? m.ten : '') + (!trongTen ? (trongChuong ? ' · ' + b.chuong : ' · có trong nội dung bài') : '')
      });
    }
  });
  return r.slice(0, 8);
}

function noiDung() {
  if (S.user.vai === 'gv') {
    switch (S.view) {
      case 'quan-ly':   return gvQuanLy();
      case 'sinh-vien': return gvSinhVien();
      case 'thong-bao': return trangThongBao();
      case 'bai':       return trangBai();
      default:          return gvTongQuan();
    }
  }
  switch (S.view) {
    case 'mon-hoc':   return svDanhSachMon();
    case 'mon':       return svChiTietMon();
    case 'bai':       return trangBai();
    case 'quiz':      return trangQuiz();
    case 'bang-diem': return svBangDiem();
    case 'thong-bao': return trangThongBao();
    default:          return svBangDieuKhien();
  }
}

/* Biểu đồ chu kỳ lượng vận động — hình ảnh chủ đạo của trang mở đầu */
function bieuDoChuKy() {
  const kl = [38, 52, 64, 44, 58, 72, 84, 54, 68, 80, 92, 60, 74, 86, 50];
  const cd = [30, 36, 42, 34, 44, 50, 58, 46, 54, 62, 70, 56, 66, 76, 58];
  const W = 420, H = 100, n = kl.length, step = W / (n - 1);
  const pt = a => a.map((v, i) => `${(i * step).toFixed(1)},${(H - v * .92).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <g stroke="rgba(255,255,255,.1)" stroke-width="1">
      ${[0, 25, 50, 75, 100].map(y => `<line x1="0" y1="${y}" x2="${W}" y2="${y}"/>`).join('')}
    </g>
    <polygon points="0,${H} ${pt(cd)} ${W},${H}" fill="rgba(224,165,22,.14)"/>
    <polyline points="${pt(kl)}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.8"/>
    <polyline points="${pt(cd)}" fill="none" stroke="#e0a516" stroke-width="2.4"/>
    ${cd.map((v, i) => i % 3 === 0
      ? `<circle cx="${(i * step).toFixed(1)}" cy="${(H - v * .92).toFixed(1)}" r="2.6" fill="#e0a516"/>` : '').join('')}
  </svg>`;
}

function viecCanLam(ms) {
  const v = [];
  ms.forEach(m => {
    const bs = baiCuaMon(m.id);
    const chua = bs.find(b => !D.xong[b.id]);
    if (chua) v.push({ ten: chua.ten, phu: m.ten, act: 'mo-bai', id: chua.id, tag: 'Bài học' });
    if (QUIZ[m.id] && !D.diem[m.id])
      v.push({ ten: QUIZ[m.id].ten, phu: m.ten, act: 'mo-quiz', id: m.id, tag: 'Kiểm tra' });
  });
  if (!v.length) return '<div class="empty"><b>Xong hết rồi</b>Em đã học hết bài và làm hết bài kiểm tra hiện có.</div>';
  return v.slice(0, 4).map(x => `
    <button class="row" style="grid-template-columns:minmax(0,1fr) auto" data-act="${x.act}" data-id="${x.id}">
      <span><b>${esc(x.ten)}</b><span class="meta">${esc(x.phu)}</span></span>
      <span class="tag ${x.tag === 'Kiểm tra' ? 'tag-wait' : ''}">${x.tag}</span>
    </button>`).join('');
}

function hangMon(m, i) {
  const td = tienDo(m.id);

}

function trangQuiz() {
  const m = timMon(S.mon);
  const q = QUIZ[S.mon];
  if (!m || !q) return '<div class="empty"><b>Môn này chưa có đề kiểm tra</b></div>';
  const st = S.quiz || { chon: {}, nop: false };

  if (st.nop) return ketQuaQuiz(m, q, st);

  const daChon = Object.keys(st.chon).length;
  return `
  <div class="crumb">
    <button data-act="mo-mon" data-id="${m.id}">${esc(m.ma)}</button><span>/</span><span>Bài kiểm tra</span>
  </div>

  </div>

  <section class="panel quiz">
    <div class="quiz-bar">
      <span class="meta">Đã chọn ${daChon} / ${q.cauhoi.length} câu</span>
      <span style="width:150px"><span class="load-bar accent"><i style="width:${daChon / q.cauhoi.length * 100}%"></i></span></span>
    </div>
    ${q.cauhoi.map((c, i) => `
      <div class="q-block">
        <div class="q-head">
          <span class="q-no">${i + 1}</span>
          <p>${esc(c.hoi)}</p>
        </div>
        ${c.dapan.map((d, j) => `
          <label class="opt ${st.chon[i] === j ? 'pick' : ''}">
            <input type="radio" name="c${i}" value="${j}" ${st.chon[i] === j ? 'checked' : ''}
              data-act="chon" data-c="${i}" data-d="${j}">
            <span>${esc(d)}</span>
          </label>`).join('')}
      </div>`).join('')}
    <div class="panel-body" style="border-top:1.5px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-accent" data-act="nop">Nộp bài</button>
      <button class="btn btn-ghost" data-act="mo-mon" data-id="${m.id}">Để sau</button>
      ${daChon < q.cauhoi.length ? `<span class="meta">Còn ${q.cauhoi.length - daChon} câu chưa chọn</span>` : ''}
    </div>
  </section>`;
}

function ketQuaQuiz(m, q, st) {
  let dung = 0;
  q.cauhoi.forEach((c, i) => { if (st.chon[i] === c.dung) dung++; });
  const diem = dung / q.cauhoi.length * 10;
  const pct = dung / q.cauhoi.length;
  const C = 2 * Math.PI * 44;
  const mau = pct >= .8 ? 'var(--go)' : pct >= .5 ? 'var(--accent)' : 'var(--stop)';
  const loi = pct >= .8 ? 'Kết quả tốt. Em đã nắm chắc nội dung chương này.'
            : pct >= .5 ? 'Đạt yêu cầu. Em nên xem lại các câu sai bên dưới.'
            : 'Chưa đạt. Em đọc lại bài rồi làm lại bài kiểm tra.';

  return `
  <div class="crumb">
    <button data-act="mo-mon" data-id="${m.id}">${esc(m.ma)}</button><span>/</span><span>Kết quả</span>
  </div>
  <div class="page-head"><h1>Kết quả bài kiểm tra</h1>
    <p class="meta">${esc(q.ten)} · ${esc(m.ten)}</p></div>

  <section class="panel quiz" style="margin-bottom:22px">
    <div class="score">
      <div class="score-ring">
        <svg viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="44" stroke="var(--line-soft)"/>
          <circle cx="52" cy="52" r="44" stroke="${mau}" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/>
        </svg>
      </div>
      <div>
        <p class="score-val">${diem.toFixed(1)} / 10</p>
        <p class="meta" style="margin:0 0 9px">Đúng ${dung} trong ${q.cauhoi.length} câu</p>
        <p style="margin:0;max-width:44ch">${loi}</p>
      </div>
    </div>
  </section>

  <section class="panel quiz">
    <div class="panel-head"><h2>Chữa bài</h2><span class="meta">Xem lại từng câu</span></div>
    ${q.cauhoi.map((c, i) => {

function diTrangDau() { window.scrollTo(0, 0); }

/* Tải tệp về máy: chạy được cả trong khung xem thử lẫn trên hosting thật */
async function taiVe(ten, noi) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: ten, data: noi }); return; }
  } catch (e) { /* người dùng từ chối hoặc không dùng được: thử cách thường */ }
  try {
    const url = URL.createObjectURL(new Blob([noi], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = ten;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {}
}

document.addEventListener('click', e => {
  const n = e.target.closest('[data-act]');
  const trongBell = e.target.closest('.bell');
  const trongTim = e.target.closest('.search');

  if (!trongBell && S.bell) { S.bell = false; ve(); return; }
  if (!trongTim && S.tim) { S.tim = ''; ve(); return; }
  if (!n) return;

  const a = n.dataset.act;

  if (a === 'nhanh') {
    const u = NGUOIDUNG.find(x => x.tk === n.dataset.tk);
    S.user = u; S.view = 'bang-dieu-khien'; loiDangNhap = ''; ve(); return;
  }
  if (a === 'thoat') { S.user = null; S.view = 'bang-dieu-khien'; ve(); return; }
  if (a === 'di')      { S.view = n.dataset.v; S.side = false; S.tim = ''; ve(); diTrangDau(); return; }
  if (a === 'mo-mon')  { S.mon = n.dataset.id; S.view = 'mon'; S.tim = ''; ve(); diTrangDau(); return; }
  if (a === 'mo-bai')  { S.bai = n.dataset.id; S.view = 'bai'; S.tim = ''; ve(); diTrangDau(); return; }
  if (a === 'mo-quiz') { S.mon = n.dataset.id; S.view = 'quiz'; S.quiz = { chon: {}, nop: false }; ve(); diTrangDau(); return; }
  if (a === 'mo-side') { S.side = true; ve(); return; }
  if (a === 'dong-side') { S.side = false; ve(); return; }
  if (a === 'bell') {
    S.bell = !S.bell;
    if (S.bell) { D.daDoc = true; ghi(); }
    ve(); return;
  }
  if (a === 'tab') { S.tab = n.dataset.t; S.flash = ''; ve(); return; }

  if (a === 'xong') {
    const id = n.dataset.id;
    if (D.xong[id]) delete D.xong[id]; else D.xong[id] = true;
    ghi(); ve(); return;
  }

  if (a === 'nop') {
    const q = QUIZ[S.mon];
    if (!S.quiz) S.quiz = { chon: {}, nop: false };
    if (Object.keys(S.quiz.chon).length < q.cauhoi.length) {
      if (!confirm('Em còn câu chưa chọn. Nộp bài luôn?')) return;
    }
    let dung = 0;
    q.cauhoi.forEach((c, i) => { if (S.quiz.chon[i] === c.dung) dung++; });
    D.diem[S.mon] = {
      diem: dung / q.cauhoi.length * 10, dung, tong: q.cauhoi.length,
      khi: new Date().toISOString()
    };
    ghi();
    S.quiz.nop = true; ve(); diTrangDau(); return;
  }

  if (a === 'xoa-bai') {
    D.baiThem = D.baiThem.filter(b => b.id !== n.dataset.id);
    ghi(); S.flash = 'Đã xóa bài học.'; ve(); return;
  }

  if (a === 'xuat') {
    const dong = [['STT', 'Mã SV', 'Họ tên', 'Khóa', 'Tiến độ (%)', 'Điểm']]
      .concat(SINHVIEN.map((s, i) => [i + 1, s.msv, s.ten, s.khoa, s.tiendo, s.diem == null ? '' : s.diem]));
    const csv = '﻿' + dong.map(r => r.join(',')).join('\n');
    taiVe('danh-sach-diem.csv', csv);
    return;
  }
});

document.addEventListener('change', e => {
  const n = e.target.closest('[data-act="chon"]');
  if (!n) return;
  if (!S.quiz) S.quiz = { chon: {}, nop: false };
  S.quiz.chon[+n.dataset.c] = +n.dataset.d;
  ve();
});

document.addEventListener('input', e => {
  const n = e.target.closest('[data-act="tim"]');
  if (!n) return;
  S.tim = n.value;
  ve();
  const inp = $('#o-tim');
  if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-act]');
  if (!f) return;
  e.preventDefault();
  const a = f.dataset.act;
  const fd = new FormData(f);

  if (a === 'vao') {
    const u = NGUOIDUNG.find(x => x.tk === fd.get('tk').trim() && x.mk === fd.get('mk'));
    if (!u) { loiDangNhap = 'Tên đăng nhập hoặc mật khẩu không đúng. Thử sv / 123 hoặc gv / 123.'; ve(); return; }
    S.user = u; S.view = 'bang-dieu-khien'; loiDangNhap = ''; ve(); return;
  }

  if (a === 'luu-bai') {
    const mon = fd.get('mon');
    const tl = fd.get('tailieu');
    const txt = fd.get('noidung').trim();
    const html = txt.split(/\n\s*\n/).map(p => `<p>${esc(p.trim()).replace(/\n/g, '<br>')}</p>`).join('');
    D.baiThem.push({
      id: 'tx' + Date.now(), mon, chuong: fd.get('chuong').trim(),
      so: baiCuaMon(mon).length + 1, ten: fd.get('ten').trim(),
      phut: +fd.get('phut'), co_slide: tl === 'slide' || tl === 'ca',
      co_video: tl === 'video' || tl === 'ca', noidung: html
    });
    ghi();
    S.flash = 'Đã lưu bài học. Sinh viên thấy bài này ngay trong môn đã chọn.';
    ve(); diTrangDau(); return;
  }

  if (a === 'luu-tb') {
    D.tbThem.unshift({
      id: 'tb' + Date.now(), ten: fd.get('ten').trim(),
      noi: fd.get('noi').trim(), khi: 'Vừa xong', moi: true
    });
    D.daDoc = false; ghi();
    S.flash = 'Đã gửi thông báo tới sinh viên.';
    ve(); diTrangDau(); return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.bell || S.side || S.tim) { S.bell = false; S.side = false; S.tim = ''; ve(); }
  }
});

/* ---------- Khởi động ------------------------------------------------- */

doc();
ve();

</script>
</body>
</html>
